<div
  class="modal-backdrop"
  role="presentation"
  (click)="onBackdropClick($event)"
  (keydown.escape)="close()"
>
  <section class="card fr-transactions modal" role="dialog" aria-modal="true" aria-labelledby="transaction-form-title">
    <div class="header-fr">
      <h3 id="transaction-form-title">Crear transacción</h3>
      <button type="button" class="button-icon close-button" aria-label="Cerrar" (click)="close()">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>
    <div class="body-fr">
      <form #transactionForm="ngForm" (ngSubmit)="onSubmit()">
        <div class="field-fr">
          <label for="transaction-date">Fecha</label>
          <div class="input-fr">
            <i class="fa-regular fa-calendar" aria-hidden="true"></i>
            <input
              #datePicker
              id="transaction-date"
              type="date"
              [(ngModel)]="transaction.date"
              name="date"
              class="native-date-picker"
              required
            >
            <input
              type="text"
              readonly
              placeholder="Selecciona una fecha"
              [value]="formattedDate"
              (focus)="datePicker.showPicker()"
              class="date-picker"
              aria-label="Fecha seleccionada"
            >
          </div>
        </div>
        <div class="field-fr">
          <label for="transaction-amount">Valor</label>
          <div class="input-fr">
            <div class="icon-number">
              <i class="fa-solid fa-dollar-sign" aria-hidden="true"></i>
            </div>
            <input
              id="transaction-amount"
              type="number"
              [(ngModel)]="transaction.amount"
              name="amount"
              placeholder="0.00"
              min="0.01"
              step="0.01"
              required
            >
          </div>
        </div>
        <div class="field-fr">
          <label for="transaction-description">Descripción</label>
          <div class="input-fr">
            <input
              id="transaction-description"
              type="text"
              [(ngModel)]="transaction.description"
              name="description"
              placeholder="Escribe una descripción"
              required
            >
          </div>
        </div>
        <div class="field-fr">
          <label for="transaction-category">Categoría</label>
          <select
            id="transaction-category"
            class="selector"
            [(ngModel)]="transaction.categoryId"
            name="category"
            [disabled]="isLoadingCategories || !!categoryLoadError"
            required
          >
            <option [ngValue]="null" disabled>
              {{isLoadingCategories ? 'Cargando categorías...' : 'Selecciona una categoría'}}
            </option>
            @for (category of categories; track category.id) {
              <option [ngValue]="category.id">{{category.name}}</option>
            }
          </select>
        </div>
        <div class="field-fr">
          <label for="transaction-type">Tipo</label>
          <select
            id="transaction-type"
            class="selector"
            [(ngModel)]="transaction.type"
            name="type"
            required
          >
            <option value="expense">Egreso</option>
            <option value="income">Ingreso</option>
          </select>
        </div>
        @if (categoryLoadError) {
          <div class="form-error" role="alert">
            <span>{{categoryLoadError}}</span>
            <button type="button" class="button-outline" (click)="loadCategories()">Reintentar</button>
          </div>
        }
        @if (saveError) {
          <p class="form-error" role="alert">{{saveError}}</p>
        }
        <button
          class="button-primary save-button"
          type="submit"
          [disabled]="transactionForm.invalid || isSaving || isLoadingCategories || categories.length === 0"
        >
          <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
          {{isSaving ? 'Guardando...' : 'Guardar'}}
        </button>
      </form>
    </div>
  </section>
</div>
