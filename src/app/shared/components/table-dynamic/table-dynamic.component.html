<div class="table-dynamic-container">
    <table class="table-dynamic" role="table">
        <thead>
            <tr role="row">
                @for(col of columns; track col) {
                <th role="columnheader">{{ col.label }}</th>
                }
            </tr>
        </thead>
        <tbody>
            @for(row of rows; track row; let i = $index;) {
            <tr role="row">
                @for(col of columns; track col) {
                <td role="cell">
                    @if(col.actions?.length) {
                    <ng-container>
                        <div class="menu-container">
                            <button
                                type="button"
                                class="button-icon"
                                [attr.aria-label]="'Opciones para ' + row.name"
                                (click)="row.showMenu = !row.showMenu"
                            >
                                <i class="fa-solid fa-ellipsis"></i>
                            </button>
                            @if(row.showMenu) {
                            <div class="menu">
                                @for (btn of col.actions; track btn.key) {
                                <button type="button" class="item-menu" (click)="onActionClick(btn.key, row)">
                                    <i
                                        [class]="btn.icon ?? 'fa-solid fa-pen'"
                                        [style.color]="btn.key === 'delete' ? '#c40b0e' : '#025ad2'"
                                        aria-hidden="true"
                                    ></i>
                                    {{ btn.label }}
                                </button>
                                }
                            </div>
                            }
                        </div>
                    </ng-container>
                    }
                    @else {
                    <ng-container>
                        {{ row[col.key] }}
                    </ng-container>
                    }
                </td>
                }
            </tr>
            }
        </tbody>
    </table>
</div>
